[project]
name = "prediction-market-trading-bot"
version = "0.1.0"
description = "Local-first prediction-market copy trading with paper mode, event-book planning, and a dashboard."
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0",
  "PyYAML>=6.0",
  "requests>=2.31",
  "websockets>=12.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:The configuration option \"asyncio_default_fixture_loop_scope\" is unset:pytest.PytestDeprecationWarning",
]
