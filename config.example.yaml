  - range
  - above_or_higher
  - below_or_lower
  repeat_buy_strategy_enabled: false
  repeat_buy_size_usdc: 5.0
  repeat_buy_stop_loss_pct: 0.0
  repeat_buy_min_source_notional_usdc: 0.0
  repeat_buy_min_buy_count: 2
  repeat_buy_min_avg_price: 0.01
