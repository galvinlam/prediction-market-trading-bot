  reserved_cash_usdc: 0.0
  # profile_json is the canonical editable wallet strategy profile. The wide
  # wallet fields above are compatibility backfill for older configs only; API
  # edits that supply profile_json ignore those wide strategy fields.
  profile_json:
    version: 1
    market_filters:
      allowed_market_types:
      - crypto
      - weather
      - sports
      - other
    weather_bracket:
      enabled: false
      copy_source_leg_size: false
      buy_size_usdc: 10.0
      stop_loss_pct: 0.0
      max_open_events: 0
