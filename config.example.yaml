sizing:
  strategy: scaled_source
  copy_scale: 1.0
  max_trade_usdc: 100.0
  max_position_usdc: 3.0
  min_trade_usdc: 0.25
  max_entry_price_source_premium: 0.25
  max_entry_price_source_multiple: 2.0
paper:
  starting_cash_usdc: 200.0
  slippage_pct: 5.0
  settlement_slippage_pct: 0.0
exits:
  mirror_source_sells: true
  stop_loss_pct: 40.0
  take_profit_pct: 0.0
  max_holding_minutes: 1440
watcher:
  exchange_contracts:
  - ctf_exchange
  - neg_risk_ctf_exchange
  confirmations: 1
  backfill_blocks: 500
  ws_ping_interval_seconds: 15.0
  ws_ping_timeout_seconds: 45.0
  ws_close_timeout_seconds: 5.0
  ws_reconnect_max_seconds: 30.0
price_monitor:
  enabled: true
  poll_interval_seconds: 30.0
  idle_poll_interval_seconds: 300.0
winner_capture:
  enabled: true
  entry_price_max: 0.35
  recover_stake_multiple: 2.0
  first_scale_multiple: 4.0
  first_scale_sell_pct: 35.0
  high_price_threshold: 0.5
  high_price_sell_pct: 50.0
  runner_pct: 15.0
  trailing_drawdown_pct: 30.0
  high_price_absolute_trail: 0.12
  sports_mid_entry_price_max: 0.70
  sports_mid_partial_price_threshold: 0.75
  sports_mid_partial_profit_pct: 35.0
  sports_mid_partial_stake_pct: 50.0
  sports_mid_full_stake_price_threshold: 0.85
  sports_mid_high_price_threshold: 0.92
  sports_mid_high_price_sell_pct: 75.0
  sports_mid_runner_pct: 15.0
  sports_dead_cut_price: 0.08
  sports_dead_cut_max_peak_gain_pct: 15.0
app:
  host: 127.0.0.1
  port: 8789
  database_url: sqlite:///data/polymarket-copy-trading.sqlite3
  live_database_url: sqlite:///data/polymarket-copy-trading-live.sqlite3
market_filters:
  enabled_market_types:
  - crypto
  - weather
  - sports
  - other
